openapi: 3.0.4
info:
  title: Tuanyagn | Ogen Demo API
  version: 0.1.0 

paths:
  /products/{id}:
    get:
      operationId: getProduct
      summary: Get one product by its id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: the product was found
          content: 
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: no product has this id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Product:
      type: object
      required: [id, name, price]
      properties:
        id: 
          type: integer
          format: int64
        name: 
          type: string
        price:
          type: number
          format: double
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

