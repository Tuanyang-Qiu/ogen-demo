openapi: 3.0.4
info:
  title: Tuanyagn | Ogen Demo API
  version: 0.1.0 

paths:
  /healthz:
    x-ogen-operation-group: health
    get:
      summary: Health check
      operationId: CheckHealth 
      tags:
        - Health
      responses:
        "200":
          description: Service is healthy
          content: 
            application/json: 
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
  /v1/products:
    x-ogen-operation-group: product
    get:
      operationId: listProducts
      summary: list all products
      tags: 
        - Product
      responses:
        "200":
          description: All products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /v1/products/{id}:
    x-ogen-operation-group: product
    get:
      operationId: getProduct
      summary: Get one product by its id
      tags:
        - Product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: the product was found
          content: 
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: no product has this id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Product:
      type: object
      required: [id, name, price]
      properties:
        id: 
          type: integer
          format: int64
        name: 
          type: string
        price:
          type: number
          format: double
        description:
          type: string
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

